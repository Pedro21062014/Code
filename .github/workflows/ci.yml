name: CI
on:
  pull_request:
  push:
    branches: [main, "security/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  rewrite-history:
    if: github.ref == 'refs/heads/security/rewrite-history-once'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/rewrite-history-once
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install git-filter-repo
      - name: Remove prompt history from every commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git filter-repo --path migrated_prompt_history --path .history-rewrite-trigger --invert-paths --prune-empty never --prune-degenerate never --force
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main HEAD:security/local-storage-cleanup HEAD:security/rewrite-history-once
